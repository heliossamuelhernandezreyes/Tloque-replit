name: Audio deep audit 20261109
on:
  push:
    branches: [codex/tloque-audio-audit-20261109]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/qa-audio-audit-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-audit-browser-results
          path: .tloque_cache/audio-audit/browser-results.json
