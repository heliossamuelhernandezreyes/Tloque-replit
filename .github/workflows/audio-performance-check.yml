name: Audio performance check

on:
  pull_request:
    paths:
      - 'client/src/audio/**'
      - 'client/src/pages/AudioCatalogAdmin.tsx'
      - 'client/src/pages/reader.tsx'
      - 'client/src/components/ReaderAudioMenu.tsx'
      - 'client/public/sw.js'
      - 'client/src/pages/VscoInstallerAdmin.tsx'
      - 'shared/audio.ts'
      - 'shared/music-brain.ts'
      - 'shared/music-brain-renderer.ts'
      - 'shared/direction.ts'
      - 'shared/narrative.ts'
      - 'shared/curated-*.ts'
      - 'shared/native-*.ts'
      - 'shared/audio-module-sources.ts'
      - 'shared/instrument-manifest.ts'
      - 'shared/native-sample-pack.ts'
      - 'shared/native-hybrid-source.ts'
      - 'shared/native-hybrid-approval-registry.ts'
      - 'shared/violin-winter-stress.ts'
      - 'server/audioModuleInstaller.ts'
      - 'server/audio.ts'
      - 'server/nativeSamplePackRoutes.ts'
      - 'server/narrative.ts'
      - 'server/audioUploads.ts'
      - 'server/sfzSamplePackCompiler.ts'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/audio-performance-check.yml'
  push:
    branches:
      - main
    paths:
      - 'client/src/audio/**'
      - 'client/src/pages/AudioCatalogAdmin.tsx'
      - 'client/src/pages/reader.tsx'
      - 'client/src/components/ReaderAudioMenu.tsx'
      - 'client/public/sw.js'
      - 'client/src/pages/VscoInstallerAdmin.tsx'
      - 'shared/audio.ts'
      - 'shared/music-brain.ts'
      - 'shared/music-brain-renderer.ts'
      - 'shared/direction.ts'
      - 'shared/narrative.ts'
      - 'shared/curated-*.ts'
      - 'shared/native-*.ts'
      - 'shared/audio-module-sources.ts'
      - 'shared/instrument-manifest.ts'
      - 'shared/native-sample-pack.ts'
      - 'shared/native-hybrid-source.ts'
      - 'shared/native-hybrid-approval-registry.ts'
      - 'shared/violin-winter-stress.ts'
      - 'server/audioModuleInstaller.ts'
      - 'server/audio.ts'
      - 'server/nativeSamplePackRoutes.ts'
      - 'server/narrative.ts'
      - 'server/audioUploads.ts'
      - 'server/sfzSamplePackCompiler.ts'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/audio-performance-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript
        run: npm run check

      - name: Audio runtime and mastering budgets
        run: node --import tsx --test tests/audio-runtime-performance.test.ts tests/audio-render-analysis.test.ts tests/audio-acoustic-stage.test.ts tests/audio-architecture-regressions.test.ts tests/audio-impulse-cache.test.ts tests/audio-progressive-preload-lifecycle.test.ts

      - name: Full tests
        run: npm test

      - name: Build
        run: npm run build
