name: Audio performance check

on:
  pull_request:
    paths:
      - 'client/src/audio/**'
      - 'client/src/pages/AudioCatalogAdmin.tsx'
      - 'client/src/pages/VscoInstallerAdmin.tsx'
      - 'shared/audio.ts'
      - 'shared/audio-module-sources.ts'
      - 'shared/instrument-manifest.ts'
      - 'shared/native-sample-pack.ts'
      - 'server/audioModuleInstaller.ts'
      - 'server/audioUploads.ts'
      - 'server/sfzSamplePackCompiler.ts'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/audio-performance-check.yml'
  push:
    branches:
      - agent/performance-engine-v1
    paths:
      - 'client/src/audio/**'
      - 'client/src/pages/AudioCatalogAdmin.tsx'
      - 'client/src/pages/VscoInstallerAdmin.tsx'
      - 'shared/audio.ts'
      - 'shared/audio-module-sources.ts'
      - 'shared/instrument-manifest.ts'
      - 'shared/native-sample-pack.ts'
      - 'server/audioModuleInstaller.ts'
      - 'server/audioUploads.ts'
      - 'server/sfzSamplePackCompiler.ts'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/audio-performance-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
