name: Core app check

on:
  pull_request:
    paths:
      - "client/src/App.tsx"
      - "client/src/pages/editor.tsx"
      - "client/src/pages/editor-direction.tsx"
      - "client/src/lib/editor-*.ts"
      - "client/src/audio/**"
      - "client/src/pages/reader.tsx"
      - "shared/music-brain.ts"
      - "server/narrative.ts"
      - "tests/music-brain.test.ts"
      - "tests/editor-workspace.test.ts"
      - ".github/workflows/editor-p0-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
