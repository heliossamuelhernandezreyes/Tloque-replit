<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <title>Tloque</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow-x: hidden;
      }
      .boot-state {
        position: relative;
        box-sizing: border-box;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 28px;
        overflow: hidden;
        padding: 24px;
        background: radial-gradient(circle at 50% 48%, rgba(118,86,190,.12), transparent 28rem), #000;
        color: white;
        text-align: center;
      }
      .boot-state::before {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(255,255,255,.19) .55px, transparent .7px);
        background-size: 37px 37px;
        opacity: .13;
        -webkit-mask-image: radial-gradient(circle, black, transparent 72%);
        mask-image: radial-gradient(circle, black, transparent 72%);
        content: "";
      }
      .boot-state__mark { position: relative; width: 122px; height: 122px; animation: boot-float 4s ease-in-out infinite; }
      .boot-state__ring, .boot-state__iris, .boot-state__star { position: absolute; display: block; }
      .boot-state__ring { inset: 12%; border: 1px solid rgba(207,190,255,.3); border-radius: 50%; box-shadow: 0 0 28px rgba(118,80,190,.12); }
      .boot-state__ring--outer { border-left-color: transparent; border-bottom-color: rgba(207,190,255,.08); animation: boot-orbit 7s linear infinite; }
      .boot-state__ring--inner { inset: 24%; border-top-color: transparent; border-right-color: rgba(255,255,255,.08); animation: boot-reverse 4.8s linear infinite; }
      .boot-state__iris { inset: 37%; display: grid; place-items: center; border: 1px solid rgba(221,211,255,.48); border-radius: 50%; background: rgba(10,7,18,.82); box-shadow: 0 0 24px rgba(165,127,255,.25); }
      .boot-state__iris::after { width: 30%; aspect-ratio: 1; border-radius: 50%; background: #d8caff; box-shadow: 0 0 14px rgba(207,188,255,.8); animation: boot-pulse 1.8s ease-in-out infinite; content: ""; }
      .boot-state__star { width: 3px; aspect-ratio: 1; border-radius: 50%; background: rgba(236,229,255,.9); box-shadow: 0 0 10px rgba(196,174,255,.8); animation: boot-star 2.1s ease-in-out infinite; }
      .boot-state__star--one { top: 11%; left: 25%; }
      .boot-state__star--two { right: 8%; bottom: 32%; animation-delay: -.7s; }
      .boot-state__star--three { left: 15%; bottom: 13%; animation-delay: -1.4s; }
      .boot-state__copy strong { display: block; font: 400 clamp(22px, 5vw, 30px)/1.2 Cinzel, Georgia, serif; letter-spacing: .48em; text-indent: .48em; color: rgba(255,255,255,.86); text-shadow: 0 0 30px rgba(185,159,255,.25); }
      .boot-state__copy span { display: block; margin-top: 12px; font: 500 9px/1.5 Inter, system-ui, sans-serif; letter-spacing: .27em; text-transform: uppercase; color: rgba(255,255,255,.28); }
      @keyframes boot-orbit { to { transform: rotate(360deg); } }
      @keyframes boot-reverse { to { transform: rotate(-360deg); } }
      @keyframes boot-float { 50% { transform: translateY(-6px); } }
      @keyframes boot-pulse { 50% { opacity: .45; transform: scale(.62); } }
      @keyframes boot-star { 50% { opacity: .25; transform: scale(.65); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-state * { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-state" role="status" aria-live="polite">
        <div class="boot-state__mark" aria-hidden="true">
          <span class="boot-state__ring boot-state__ring--outer"></span>
          <span class="boot-state__ring boot-state__ring--inner"></span>
          <span class="boot-state__iris"></span>
          <i class="boot-state__star boot-state__star--one"></i>
          <i class="boot-state__star boot-state__star--two"></i>
          <i class="boot-state__star boot-state__star--three"></i>
        </div>
        <div class="boot-state__copy">
          <strong>Tloque</strong>
          <span>Narrativas que permanecen</span>
        </div>
        <noscript>Tloque necesita JavaScript para funcionar.</noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
