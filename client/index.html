<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <title>Tloque</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow-x: hidden;
      }
      .boot-state {
        box-sizing: border-box;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        color: rgba(255,255,255,.52);
        font: 500 11px/1.5 Inter, system-ui, sans-serif;
        letter-spacing: .22em;
        text-transform: uppercase;
        text-align: center;
      }
      .boot-state__light {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: rgba(196,181,253,.72);
        box-shadow: 0 0 22px rgba(139,92,246,.45);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-state" role="status" aria-live="polite">
        <span class="boot-state__light" aria-hidden="true"></span>
        <span>Iniciando Tloque</span>
        <noscript>Tloque necesita JavaScript para funcionar.</noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
