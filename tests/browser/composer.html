<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tloque · QA del compositor</title>
<style>
  * { box-sizing: border-box } body { margin: 0; background: #14171e; color: #e4e4e7; font: 14px system-ui }
  header { padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px }
  button { min-height: 44px; padding: 8px 14px; border: 1px solid #485364; border-radius: 10px; background: #202935; color: white; cursor: pointer }
  iframe { display: block; width: 390px; max-width: 100%; height: 820px; border: 1px solid #485364; margin: 0 auto }
</style></head>
<body><header><strong>QA local · interfaz real</strong><span>Audio y Fonoteca simulados; sin datos de producción.</span><button data-width="360">360 px</button><button data-width="390">390 px</button><button data-width="768">768 px</button><button data-width="1280">1280 px</button></header><iframe title="Estudio de prueba" src="/studio" allow="clipboard-read; clipboard-write"></iframe><script>
  for (const button of document.querySelectorAll('[data-width]')) button.addEventListener('click', () => { document.querySelector('iframe').style.width = button.dataset.width + 'px'; });
</script></body></html>
